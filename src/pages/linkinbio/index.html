        "@graph": [

            "@type": "Organization",
            "@id": "__SITE_URL__/#organization",
            "name": "Zeller Industries",
            "url": "__SITE_URL__/",

              "@type": "ImageObject",

              "url": "__SITE_URL__/assets/logo.webp",

              "height": 512

              "__LINKEDIN_URL__",
              "__GITHUB_URL__",

            "name": "Zeller Industries",

            },
            "about": {

            },

            "inLanguage": "it-IT"
          }

          id="site-logo"
          width="64"

        <h1>
          <span class="sr-only"> Zeller Industries – Sviluppo software e consulenza IT </span>
          <span id="title-zeller" aria-hidden="true">ZELLER</span>
          <span id="title-industries" aria-hidden="true">INDUSTRIES</span>
        </h1>
      </div>
    </header>
    <main>
      <!-- SOCIALS -->
      <section id="socials-section" aria-labelledby="socials-title">
        <h2 id="socials-title">Social</h2>
        <nav aria-label="Social">
          <ul id="socials-links" class="reset list">
            <li>
              <a href="__LINKEDIN_URL__" target="_blank" rel="noopener noreferrer" class="btn">
                <i class="icon linkedin tile primary" aria-hidden="true"></i>
                <span>LinkedIn</span>
              </a>
            </li>
            <li>
              <a href="__GITHUB_URL__" target="_blank" rel="noopener noreferrer" class="btn">
                <i class="icon github tile primary" aria-hidden="true"></i>
                <span>GitHub</span>
              </a>
            </li>
            <li>
              <a href="__INSTAGRAM_URL__" target="_blank" rel="noopener noreferrer" class="btn">
                <i class="icon instagram tile primary" aria-hidden="true"></i>
                <span>Instagram</span>
              </a>
            </li>
            <li>
              <a href="__FACEBOOK_URL__" target="_blank" rel="noopener noreferrer" class="btn">
                <i class="icon facebook tile primary" aria-hidden="true"></i>
                <span>Facebook</span>
              </a>
            </li>
          </ul>
        </nav>
      </section>

      <!-- CONTACT -->
      <section id="contact-section" aria-labelledby="contact-title">
        <h2 id="contact-title">Contatti</h2>
        <nav aria-label="Contatti rapidi">
          <ul id="contact-links" class="reset list">
            <li>
              <a href="/form" class="btn">
                <i class="icon send-fill tile primary" aria-hidden="true"></i>
                <span>Modulo di Contatto</span>
              </a>
            </li>
            <li>
              <a href="__WHATSAPP_URL__" target="_blank" rel="noopener noreferrer" class="btn">
                <i class="icon whatsapp tile primary" aria-hidden="true"></i>
                <span>WhatsApp</span>
              </a>
            </li>
          </ul>
        </nav>
